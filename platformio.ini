    -D MIDI_ACTIVITY_LIGHTS
    -D RGB_ENCODERS
    -D BUTTON_LEDS
    -D ONBOARD_BUTTON_INTERFACE
    -D MCP_23017
    -D SMFPLAYER
    -D GLOW
    -D MUSIKANDMORE
    -D SECOND_SD
    -D GRANULAR
    ;-D APC=2
custom_firmware_name = PSRAM-CAPACITIVE_TOUCH-MAM_SPDIF

[env:psram_capacitive_mam_apc]
