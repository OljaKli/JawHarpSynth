    -D MCP_23008
    -D RGB_ENCODERS
    -D DRUMS_FILTERS
    -D MIDI_ACTIVITY_LIGHTS
    -D SMFPLAYER
    -D GLOW
    -D SECOND_SD
    -D GRANULAR
custom_firmware_name = MDTX

[env:psram-esp-display]
build_flags = 
    ${common.build_flags}
    -D COMPILE_FOR_PSRAM
    -D PSRAM
    -D DRUMS_FILTERS
    -D MIDI_ACTIVITY_LIGHTS
    -D SMFPLAYER
    -D GLOW
    -D GRANULAR
    -D ESP_DISPLAY
    ;-D TOUCHMENU
custom_firmware_name = PSRAM-ESP_DISPLAY

