    -D RGB_ENCODERS
    -D BUTTON_LEDS
    -D ONBOARD_BUTTON_INTERFACE
    -D MCP_23017
    -D SMFPLAYER
    -D GLOW
    -D MUSIKANDMORE
    -D SECOND_SD
    -D GRANULAR
    ;-D APC=2
custom_firmware_name = MAM-CAP_TOUCH-SPDIF

[env:mam-capacitive_apc]
; PSRAM_CAPACITIVE
build_flags = 
    ${common.build_flags}
    -D COMPILE_FOR_PSRAM
    -D PSRAM
    -D CAPACITIVE_TOUCH_DISPLAY
    -D DRUMS_FILTERS
    -D MIDI_ACTIVITY_LIGHTS
    -D RGB_ENCODERS
    -D BUTTON_LEDS
    -D ONBOARD_BUTTON_INTERFACE
    -D MCP_23017
    -D SMFPLAYER
    -D MUSIKANDMORE
    -D APC=2
    -D GLOW
    -D SECOND_SD
    -D GRANULAR
custom_firmware_name = MAM-CAP_TOUCH-APC

[env:psram_mdtx]
; PSRAM_MDTX
build_flags = 
    ${common.build_flags}
