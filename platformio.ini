    -D DRUMS_FILTERS
    -D MIDI_ACTIVITY_LIGHTS
    -D RGB_ENCODERS
    -D BUTTON_LEDS
    -D ONBOARD_BUTTON_INTERFACE
    -D MCP_23017
    -D SMFPLAYER
    -D MUSIKANDMORE
    -D APC=2
    -D GLOW
